<style>
/* ===== ORIGINAL STYLES (verbatim from the old index.html) ===== */
        :root {
            --accent: #5E5CE6;
            --accent-dark: #4442B1;
            --bg: #F5F5F7;
            --glass-border: rgba(255, 255, 255, 0.45);
            --glass-shadow: 0 12px 40px -8px rgba(31, 38, 135, 0.08);
            --ease-fluid: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); overflow-x: hidden; overflow-y: auto;
            -webkit-overflow-scrolling: touch;

            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
            letter-spacing: -0.02em; color: #1d1d1f;
            -webkit-touch-callout: none;
        }

        .glass {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        .hanja-font { font-family: 'Noto Serif KR', serif; }
        .hidden { display: none !important; }

        .aurora-container { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #F5F5F7; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55; animation: float 14s infinite ease-in-out; will-change: transform; }
        .blob-1 { top: -10%; left: -5%; width: 50vw; height: 50vw; background: #E0E7FF; }
        .blob-2 { bottom: -10%; right: -5%; width: 40vw; height: 40vw; background: #FAE8FF; animation-delay: -7s; }
        .blob-3 { top: 30%; left: 20%; width: 30vw; height: 30vw; background: #F0F9FF; animation-delay: -4s; opacity: 0.35; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .primary-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.35);
            transition: all 0.4s var(--ease-bounce);
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        @media (hover: hover) {
            .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px -4px rgba(99, 102, 241, 0.5); }
        }
        .primary-btn:active { transform: scale(0.92) translateY(2px); opacity: 0.9; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3); transition: all 0.1s; }
        .primary-btn:disabled { opacity: 0.4; transform: none; box-shadow: none; background: #c7c8f0; pointer-events: none; }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 15px 30px -2px rgba(99, 102, 241, 0.6); transform: scale(1.02); }
        }
        .btn-pulse:not(:disabled) { animation: pulseGlow 2s infinite var(--ease-fluid); }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUpFade 0.6s var(--ease-bounce) both; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }

        @keyframes textPop {
            0% { opacity: 0; transform: translateY(15px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .text-pop { animation: textPop 0.5s var(--ease-bounce) both; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-error { animation: shake 0.4s var(--ease-fluid); color: #f43f5e !important; border-bottom-color: #f43f5e !important; }

        @keyframes hoverFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .icon-float { animation: hoverFloat 3s ease-in-out infinite; }
        .icon-float-hover { transition: transform 0.3s ease-in-out; }
        @media (hover: hover) {
            .group:hover .icon-float-hover {
                animation: hoverFloat 3s ease-in-out infinite;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important; scroll-behavior: auto !important;
            }
            .blob { animation: none !important; }
        }

        .chapter-btn { 
            transition: transform 0.4s var(--ease-bounce), background-color 0.3s var(--ease-fluid), border-color 0.3s var(--ease-fluid), box-shadow 0.4s var(--ease-bounce);

        .chapter-btn.selected {

            box-shadow: 0 15px 30px -8px rgba(94, 92, 230, 0.4);

        /* --- 🚀 퀴즈 피드백 애니메이션 강화 --- */

        @keyframes feedbackPop {

        #quiz-feedback.show #feedback-icon-box.wrong { animation: feedbackShake 0.5s var(--ease-fluid) both; box-shadow: 0 0 40px rgba(244, 63, 94, 0.4); }
        #quiz-feedback.show #feedback-text-box { animation: feedbackTextSlideUp 0.4s var(--ease-fluid) 0.05s both; }
        
        /* 다크 모드 스타일 */
        .dark-theme {
            --accent: #706DFF; /* Brighter for better contrast */
            --accent-dark: #5E5CE6;
            --bg: #121212; /* Switched from black to off-black */

            background-color: var(--bg);

        }

        .dark-theme .glass {
            background: rgba(36, 36, 38, 0.8); /* Slightly lighter glass bg */

            -webkit-backdrop-filter: blur(28px) saturate(180%);

            box-shadow: 0 0 60px -20px rgba(0,0,0,0.5); /* subtle dark glow for depth */
        }

        .dark-theme .aurora-container { background: var(--bg); }
        .dark-theme .blob { filter: blur(100px); opacity: 0.15; } /* even more subtle */
        .dark-theme .blob-1 { background: #5E5CE6; animation-duration: 22s; }
        .dark-theme .blob-2 { background: #9A3EAF; animation-duration: 22s; }
        .dark-theme .blob-3 { background: #006AB5; animation-duration: 26s; opacity: 0.12;}
        
        /* --- Refined Overrides with better contrast and depth --- */

        /* Removing all shadows first */
        .dark-theme .shadow-xl, .dark-theme .shadow-lg, .dark-theme .shadow-md, .dark-theme .shadow-sm, .dark-theme .sm\:hover\:shadow-xl:hover, .dark-theme .sm\:hover\:shadow-md:hover { box-shadow: none !important; }
        
        /* Adding back controlled glows for elevated surfaces */
        .dark-theme #study-card-inner, .dark-theme #quiz-card, .dark-theme #view-result .glass {
            box-shadow: 0 0 50px -15px rgba(0,0,0,0.6) !important;
            border: 1.5px solid var(--glass-border) !important;
        }
        .dark-theme #footer-menu .glass {
            box-shadow: 0 25px 50px -15px rgba(0,0,0,0.6) !important;
            border-top: 1.5px solid var(--glass-border) !important;
        }
        .dark-theme .chapter-btn.selected {
            background: var(--accent);
            color: white;
            font-weight: 700;
            border-color: var(--accent);
            box-shadow: 0 0 30px 0px rgba(112, 109, 255, 0.5);
        }
        .dark-theme .chapter-btn {
            background: rgba(36, 36, 38, 0.8);
        }

        /* Text colors for contrast */
        .dark-theme .text-gray-900 { color: rgba(255, 255, 255, 0.95) !important; }
        .dark-theme .text-gray-800, .dark-theme .sm\:hover\:text-indigo-600:hover { color: rgba(255, 255, 255, 0.87) !important; }
        .dark-theme .text-gray-700 { color: rgba(255, 255, 255, 0.8) !important; }
        .dark-theme .text-gray-600 { color: rgba(255, 255, 255, 0.7) !important; }
        .dark-theme .text-gray-500 { color: rgba(255, 255, 255, 0.62) !important; }
        .dark-theme .text-gray-400, .dark-theme .placeholder\:text-gray-400::placeholder { color: rgba(255, 255, 255, 0.5) !important; }
        
        .dark-theme .text-indigo-600 { color: var(--accent) !important; }
        .dark-theme .text-indigo-500 { color: #9D9BFF !important; }
        .dark-theme .text-indigo-400 { color: #A09EFF !important; }
        .dark-theme .text-rose-500 { color: #ff8fa3 !important; }
        .dark-theme .hanja-font { color: rgba(255, 255, 255, 0.62) !important; }
        .dark-theme #quiz-prompt-text.hanja-font { color: rgba(255, 255, 255, 0.92) !important; }

        /* Background colors for contrast */
        .dark-theme .bg-white\/50 { background-color: rgba(36, 36, 38, 0.5) !important; }
        .dark-theme .bg-white\/70 { background-color: rgba(36, 36, 38, 0.7) !important; }
        .dark-theme .bg-gray-50, .dark-theme .sm\:hover\:bg-white:hover { background-color: #2a2a2c !important; }
        .dark-theme .bg-gray-100, .dark-theme .sm\:hover\:bg-gray-200:hover { background-color: #38383a !important; }
        .dark-theme .bg-gray-200\/50 { background-color: rgba(58, 58, 60, 0.5) !important; }
        .dark-theme .bg-indigo-50, .dark-theme .bg-indigo-50\/50, .dark-theme .sm\:hover\:bg-indigo-100:hover { background-color: rgba(94, 92, 230, 0.12) !important; }
        .dark-theme .bg-indigo-100, .dark-theme .hover\:bg-indigo-100:hover { background-color: rgba(94, 92, 230, 0.18) !important; }

        /* Borders for definition */
        .dark-theme .border-transparent { border-color: transparent !important; }

        .dark-theme .focus\:border-indigo-600:focus { border-color: var(--accent) !important; }
        
        /* Button glows */
        .dark-theme .primary-btn { box-shadow: 0 4px 20px -2px rgba(99, 102, 241, 0.4); }
        .dark-theme .primary-btn:disabled { background: #38383a; color: rgba(255, 255, 255, 0.45); box-shadow: none; }
        @media (hover: hover) { .dark-theme .primary-btn:hover { box-shadow: 0 8px 25px -2px rgba(99, 102, 241, 0.5); } }
        
        .dark-theme #quiz-feedback.show #feedback-icon-box.correct { box-shadow: 0 0 40px rgba(16, 185, 129, 0.5); }
        .dark-theme #quiz-feedback.show #feedback-icon-box.wrong { box-shadow: 0 0 40px rgba(244, 63, 94, 0.5); }
        .dark-theme #quiz-feedback.show { background-color: rgba(22, 22, 24, 0.85) !important; }
        .dark-theme #quiz-feedback.show.correct-feedback { background-color: rgba(6, 38, 26, 0.85) !important; }
        .dark-theme #quiz-feedback.show.wrong-feedback { background-color: rgba(40, 18, 22, 0.85) !important; }
        .dark-theme #feedback-answer { color: rgba(255, 255, 255, 0.95) !important; }

        /* ===== 추가 스타일 (접근성 · 신규 기능) ===== */
        input, textarea, .selectable { -webkit-user-select: text; user-select: text; }

        button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
            outline: 3px solid var(--accent); outline-offset: 2px;
        }
        input:focus-visible { outline: none; }

        #footer-menu { bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
        #btn-start-study:disabled { opacity: 0.5; pointer-events: none; }

        /* 문제 유형 선택 */
        .seg-btn {
            height: 44px; border-radius: 16px; font-size: 12px; font-weight: 800; color: #374151;
            border: 1px solid transparent; transition: transform 0.3s var(--ease-bounce), background-color 0.3s var(--ease-fluid);
        }
        .seg-btn:active { transform: scale(0.94); }
        .seg-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
        .dark-theme .seg-btn { color: rgba(255, 255, 255, 0.7); }
        .dark-theme .seg-btn.selected { color: #fff; }

        /* 챕터 타일의 외운 개수 진행 막대 */
        .tile-bar { position: absolute; left: 14px; right: 14px; bottom: 7px; height: 3px; border-radius: 3px; background: rgba(120, 120, 140, 0.2); overflow: hidden; }

        .pill-btn { font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 12px; transition: transform 0.3s var(--ease-bounce), background-color 0.3s; color: #4b5563; }

        @media (max-width: 640px) {
            .blob { animation: none; filter: blur(60px); }
            .dark-theme .blob { filter: blur(70px); }

<style>
/* ===== STORY HARNESS ===== */
html, body { height: auto; overflow: hidden; }
body { position: relative; width: 1440px; height: 1200px; }
#frame-bg { position: absolute; left: 240px; top: 0; width: 960px; height: 960px; overflow: hidden; }
#frame-bg .aurora-container { position: absolute; inset: 0; z-index: 0; }
#frame-bg .blob-1 { width: 50%; height: 50%; }
#frame-bg .blob-2 { width: 42%; height: 42%; }
#frame-bg .blob-3 { width: 32%; height: 32%; }
#stage { position: absolute; left: 0; top: 0; width: 1252px; zoom: 1.15; z-index: 2; }
#app { padding-top: 20px; }
#app .animate-slide-up, #app .fade-enter-active { animation: none !important; }
.blob { animation: none !important; }
.footer-stub { display: none; }
#credit { position: absolute; left: 1188px; top: 940px; transform: translateX(-100%); z-index: 90; font-size: 12px; letter-spacing: .01em; color: #8A857F; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; }
#hairline { position: absolute; left: 0; right: 0; bottom: -12px; height: 1px; background: rgba(28,27,26,.08); opacity: 0; }

/* ===== TRANSITIONS: every step only changes values ===== */
html, body, .aurora-container { transition: background-color 700ms ease, opacity 700ms ease; }
#app *, #app *::before {
  transition-property: padding, gap, row-gap, column-gap, margin, color, background-color, border-color, border-radius,
    box-shadow, opacity, font-size, letter-spacing, font-weight, height, transform, backdrop-filter, -webkit-backdrop-filter, stroke-width, left, right, bottom;
  transition-duration: 700ms; transition-timing-function: ease; transition-delay: 0s;
}
html.static *, html.static *::before { transition: none !important; }

/* ===== swaps ===== */
.swap { display: inline-grid; vertical-align: baseline; }
.swap > .from, .swap > .to { grid-area: 1 / 1; white-space: pre; }
#app .swap .l { display: inline-block; white-space: pre; transition: opacity 380ms ease, filter 380ms ease, transform 380ms ease; transition-delay: calc(var(--i) * 30ms); }
#app .swap .from .l { opacity: 1; filter: blur(0); transform: none; }
#app .swap .to .l { opacity: 0; filter: blur(6px); transform: translateY(.7em); }
#app .swap.on .from .l { opacity: 0; filter: blur(7px); transform: translateY(-.4em); }
#app .swap.on .to .l { opacity: 1; filter: blur(0); transform: none; transition-delay: calc(var(--i) * 30ms + 260ms); }

/* icon crossfade (symbol -> line icon) */
.xfade { position: relative; display: inline-flex; width: 14px; height: 14px; align-items: center; justify-content: center; margin-right: 4px; vertical-align: -2px; }
.xfade > * { position: absolute; transition: opacity 600ms ease, transform 600ms ease; }
.xfade .sym { opacity: 1; font-size: 13px; line-height: 1; }
.xfade svg { opacity: 0; transform: scale(.7); }
html.s2 .xfade .sym { opacity: 0; transform: scale(.7); }
html.s2 .xfade svg { opacity: 1; transform: none; }

/* appear / vanish */
[data-in] { opacity: 0; }
[data-in].in { opacity: 1; }
[data-out].out { opacity: 0; }

<script>
(function () {
  var html = document.documentElement;
  var meta = function (n) { var m = document.querySelector('meta[name="' + n + '"]'); return m ? m.content : ''; };
  var steps = meta('unslop-steps').split(',').map(function (s) { return s.trim(); });
  var STEP_AT = [1400, 3500, 5600, 7700];   // ms at which step 1..4 begins
  var TOTAL = 10000;
  var APP_W = 520;                          // css width of #app (unzoomed)
  var cur = 0, ready = false;

  // --- swaps: split into letters ---
  document.querySelectorAll('.swap').forEach(function (sw) {
    ['from', 'to'].forEach(function (k) {
      var el = sw.querySelector('.' + k), t = el.textContent; el.textContent = '';
      Array.from(t).forEach(function (ch, i) {
        var s = document.createElement('span'); s.className = 'l'; s.style.setProperty('--i', i);
        s.textContent = ch === ' ' ? ' ' : ch; el.appendChild(s);
      });
    });
  });

  // --- redline overlay ---
  var rl = document.getElementById('redline');
  var factor = function () { return document.getElementById('app').getBoundingClientRect().width / APP_W; };
  var groups = {};
  document.querySelectorAll('[data-gap]').forEach(function (el) {
    el.getAttribute('data-gap').split(/\s+/).forEach(function (g) { (groups[g] = groups[g] || []).push(el); });
  });
  var gapObjs = Object.keys(groups).filter(function (g) { return groups[g].length === 2; }).map(function (g) {
    var fill = document.createElement('div'); fill.className = 'rl-fill';
    var tag = document.createElement('div'); tag.className = 'rl-tag';
    rl.appendChild(fill); rl.appendChild(tag);
    return { els: groups[g], fill: fill, tag: tag };
  });
  var radObjs = Array.from(document.querySelectorAll('[data-radius]')).map(function (el) {
    var box = document.createElement('div'); box.className = 'rl-box rl-r';
    var tag = document.createElement('div'); tag.className = 'rl-tag rl-r';
    rl.appendChild(box); rl.appendChild(tag);
    return { el: el, box: box, tag: tag };
  });
  // slop tags: [text, anchor selector or frame-relative point, relative x,y (0-1), appears during step before n]
  var slopDefs = [
    { t: 'Aurora blobs', n: 2, pt: function () { return [240 + 960 * .86, 960 * .88]; } },
    { t: 'Glass blur', n: 2, el: '#btn-review', rx: .78, ry: 0 },
    { t: 'Uppercase tracking', n: 3, el: '#quiz-type-title', rx: 1, ry: .5, dx: 95 },
    { t: 'Heavy shadow', n: 4, el: '#btn-start-study', rx: .5, ry: 1.0 }
  ];
  var slopObjs = slopDefs.map(function (d) {
    var el = document.createElement('div'); el.className = 'slop'; el.textContent = d.t; rl.appendChild(el);
    return { d: d, el: el };
  });

  function updateOverlay() {
    var f = factor();
    gapObjs.forEach(function (g) {
      var a = g.els[0].getBoundingClientRect(), b = g.els[1].getBoundingClientRect();
      if (a.top > b.top) { var t = a; a = b; b = t; }
      var y1 = a.bottom, y2 = b.top, h = Math.max(0, y2 - y1);
      var x = Math.max(a.left, b.left), w = Math.min(a.right, b.right) - x;
      // narrow groups (tile rows) show tag beside the box
      g.fill.style.cssText = 'left:' + x + 'px;top:' + y1 + 'px;width:' + w + 'px;height:' + h + 'px;';
      g.tag.style.left = (x + w / 2 - 14) + 'px'; g.tag.style.top = (y1 + h / 2) + 'px';
      g.tag.textContent = Math.round(h / f) + 'px';
      var fixed = cur >= 1;
      g.fill.classList.toggle('fixed', fixed); g.tag.classList.toggle('fixed', fixed);
      var vis = cur <= 1;
      g.fill.classList.toggle('vis', vis); g.tag.classList.toggle('vis', vis);
    });
    radObjs.forEach(function (r) {
      var rc = r.el.getBoundingClientRect(), cs = getComputedStyle(r.el);
      var rad = parseFloat(cs.borderTopLeftRadius) || 0;
      r.box.style.cssText = 'left:' + rc.left + 'px;top:' + rc.top + 'px;width:' + rc.width + 'px;height:' + rc.height + 'px;border-radius:' + (rad * f) + 'px;';
      r.tag.style.left = (rc.left + 10) + 'px'; r.tag.style.top = (rc.top + 2) + 'px';
      r.tag.textContent = 'r ' + Math.round(rad);
      var fixed = cur >= 4;
      r.box.classList.toggle('fixed', fixed); r.tag.classList.toggle('fixed', fixed);
      var vis = cur >= 3 && cur <= 4;
      r.box.classList.toggle('vis', vis); r.tag.classList.toggle('vis', vis);
    });
    slopObjs.forEach(function (s) {
      var x, y;
      if (s.d.pt) { var p = s.d.pt(); x = p[0]; y = p[1]; }
      else {
        var r = document.querySelector(s.d.el).getBoundingClientRect();
        x = r.left + r.width * s.d.rx + (s.d.dx || 0); y = r.top + r.height * s.d.ry;
      }
      s.el.style.left = x + 'px'; s.el.style.top = y + 'px';
      s.el.classList.toggle('vis', cur === s.d.n - 1);
    });
  }

  // --- apply step n ---
  function applyStep(n) {
    cur = n;
    for (var i = 1; i <= 4; i++) html.classList.toggle('s' + i, n >= i);
    document.querySelectorAll('.swap').forEach(function (s) { s.classList.toggle('on', n >= +s.dataset.at); });
    document.querySelectorAll('[data-out]').forEach(function (e) { e.classList.toggle('out', n >= +e.dataset.out); });
    document.querySelectorAll('[data-in]').forEach(function (e) { e.classList.toggle('in', n >= +e.dataset.in); });
  }

  // --- real-time player ---
  var timers = [];
  function setStep(n) { applyStep(n); updateOverlay(); }
  function play() {
    timers.forEach(clearTimeout); timers = [];
    setStep(0);
    var base = STEP_AT[0];
    for (var i = 1; i <= 4; i++) (function (k) {
      timers.push(setTimeout(function () { setStep(k); }, base + (k - 1) * 2100));
    })(i);
  }
  (function loop() { updateOverlay(); requestAnimationFrame(loop); })();

  // --- deterministic virtual clock ---
  var t0map = new WeakMap(), lastStep = 0;
  function seek(ms) {
    var n = 0;
    for (var i = 0; i < STEP_AT.length; i++) if (ms >= STEP_AT[i]) n = i + 1;
    if (n !== lastStep) {
      // set (possibly several) steps at their exact start times, then record transition origins
      for (var k = lastStep + 1; k <= n; k++) {
        applyStep(k); getComputedStyle(document.body).opacity; updateOverlay();
        document.getAnimations().forEach(function (a) { if (!t0map.has(a)) t0map.set(a, STEP_AT[k - 1]); });
      }
      lastStep = n;
    }
    document.getAnimations().forEach(function (a) {
      var o = t0map.has(a) ? t0map.get(a) : 0, t = ms - o;
      var end = a.effect.getComputedTiming().endTime;
      if (t >= end) { try { a.finish(); } catch (e) {} } else { a.pause(); a.currentTime = Math.max(0, t); }
    });
    updateOverlay();
    return n;
  }

  window.__story = { steps: steps, setStep: setStep, play: play, seek: seek, total: TOTAL, stepAt: STEP_AT };

  var q = new URLSearchParams(location.search);
  if (q.has('step')) { html.classList.add('static'); setStep(Math.max(0, Math.min(4, +q.get('step') || 0))); }
  else if (!q.has('manual')) { setTimeout(play, 300); }
  else { applyStep(0); updateOverlay(); }
})();
</script>
</body>
